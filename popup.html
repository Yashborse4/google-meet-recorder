<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Google Meet Recorder</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #202124;
        color: #e8eaed;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 12px;
        font-weight: 600;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .rec-dot {
        width: 8px;
        height: 8px;
        background: #ea4335;
        border-radius: 50%;
        display: inline-block;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 500;
        border-radius: 6px;
        border: 1px solid #3c4043;
        background: #303134;
        color: #e8eaed;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      button:hover:not(:disabled) {
        background: #3c4043;
        border-color: #5f6368;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: #ea4335;
        border-color: #ea4335;
        color: #ffffff;
      }
      button.primary:hover:not(:disabled) {
        background: #d93025;
        border-color: #d93025;
      }
      button.success {
        border-color: #34a853;
        color: #81c995;
      }
      hr {
        border: none;
        border-top: 1px solid #3c4043;
        margin: 10px 0;
      }
      #recovery-card {
        display: none;
        background: rgba(234, 67, 53, 0.12);
        border: 1px solid #ea4335;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 12px;
      }
      #recovery-card p {
        margin: 0 0 8px;
        font-size: 12px;
        line-height: 1.4;
        color: #f28b82;
      }
      .card-actions {
        display: flex;
        gap: 6px;
      }
      .card-actions button {
        margin-bottom: 0;
        font-size: 11px;
        padding: 6px 8px;
      }
    </style>
  </head>
  <body>
    <h2><span class="rec-dot"></span> Google Meet Recorder</h2>

    <!-- Crash / Tab-close recovery card -->
    <div id="recovery-card">
      <p id="recovery-msg">Unfinished recording detected from previous session.</p>
      <div class="card-actions">
        <button id="recover-btn" class="primary">Recover & Download</button>
        <button id="discard-btn">Discard</button>
      </div>
    </div>

    <button id="save">Download Transcript (.txt)</button>
    <hr />
    <button id="enable-mic">Enable Microphone</button>
    <hr />
    <button id="start-rec" class="primary">Start Recording (Tab)</button>
    <button id="stop-rec" disabled>Stop & Download</button>

    <script src="popup.js"></script>
  </body>
</html>
