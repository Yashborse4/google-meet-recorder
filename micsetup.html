<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Enable Microphone - Meet Recorder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #18191c;
      color: #f2f3f5;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #222428;
      border: 1px solid #363940;
      border-radius: 12px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #ffffff;
    }
    p {
      margin: 0 0 20px;
      font-size: 13px;
      color: #c4c7cc;
      line-height: 1.5;
    }
    button {
      background: #ea4335;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #d93025;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #status {
      margin-top: 14px;
      font-size: 12px;
      min-height: 18px;
      color: #8e949e;
    }
    #status.success {
      color: #81c995;
      font-weight: 600;
    }
    #status.error {
      color: #f28b82;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎙️</div>
    <h2>Enable Microphone Access</h2>
    <p>Allow microphone access so Google Meet Recorder can include your voice in meeting recordings.</p>
    <button id="enable">Allow Microphone</button>
    <div id="status"></div>
  </div>
  <script src="micsetup.js"></script>
</body>
</html>
